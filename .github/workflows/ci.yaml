name: CI

on:
  push:
    branches: ["main", "master"]
    tags:
      - "v*"
  pull_request:
    branches: ["main", "master"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: |
          mkdir -p artifacts
          pytest -m "not integration" --junitxml=artifacts/pytest.xml

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: artifacts/pytest.xml

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch PR base and head commits
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          base_repo="${{ github.event.pull_request.base.repo.full_name }}"
          head_repo="${{ github.event.pull_request.head.repo.full_name }}"

          git fetch --no-tags --depth=1 \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${base_repo}.git" \
            "${base_sha}"

          if [ "${head_repo}" = "${base_repo}" ]; then
            git fetch --no-tags --depth=1 origin "${head_sha}"
          else
            git fetch --no-tags --depth=1 \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${head_repo}.git" \
              "${head_sha}"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Build audit requirements
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          data = tomllib.loads(Path("pyproject.toml").read_text())
          dependencies = data["project"]["dependencies"]
          Path("requirements-audit.txt").write_text("\n".join(dependencies) + "\n")
          PY

      - name: Audit dependencies for critical vulnerabilities
        run: |
          pip-audit --strict -r requirements-audit.txt

      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
