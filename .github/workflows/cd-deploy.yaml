name: CD - Deploy to Azure ML

on:
  workflow_run:
    workflows: ["CI"]        # must match the name: CI
    types:
      - completed

jobs:
  deploy:
    name: Deploy after successful CI
    runs-on: ubuntu-latest

    # Only run if:
    # - CI concluded successfully
    # - The ref (branch/tag) name starts with "v" → version tag
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')

    env:
      # Azure auth & workspace info from GitHub Secrets
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_ML_RESOURCE_GROUP: ${{ secrets.AZURE_ML_RESOURCE_GROUP }}
      AZURE_ML_WORKSPACE: ${{ secrets.AZURE_ML_WORKSPACE }}

      # Endpoint / deployment config
      ENDPOINT_NAME: fraud-detection-1df0
      DEPLOYMENT_NAME: blue

      # Use the tag name (e.g. v1.0.0) as version
      APP_VERSION: ${{ github.event.workflow_run.head_branch }}

    steps:
      - name: Checkout repository at CI commit
        uses: actions/checkout@v4
        with:
          # Checkout the exact commit that CI ran on
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project (runtime deps or dev)
        run: |
          pip install -e ".[dev]"

      - name: Log in to Azure using service principal
        run: |
          az login \
            --service-principal \
            --tenant "$AZURE_TENANT_ID" \
            --username "$AZURE_CLIENT_ID" \
            --password "$AZURE_CLIENT_SECRET"

          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

      - name: Install Azure ML CLI extension and configure defaults
        run: |
          az extension add -n ml -y
          az configure --defaults \
            group=$AZURE_ML_RESOURCE_GROUP \
            workspace=$AZURE_ML_WORKSPACE

      # Optional: prepare model artifact
      - name: Prepare model artifact (optional)
        run: |
          if [ -f deploy/prepare_model.py ]; then
            python deploy/prepare_model.py --version "$APP_VERSION"
          else
            echo "No deploy/prepare_model.py found, skipping model preparation."
          fi

      - name: Deploy to Azure ML endpoint
        run: |
          python deploy/aml_deploy.py \
            --endpoint-name "$ENDPOINT_NAME" \
            --deployment-name "$DEPLOYMENT_NAME" \
            --version "$APP_VERSION"

      - name: Smoke test deployed endpoint
        run: |
          if [ -f deploy/smoke_test_endpoint.py ]; then
            python deploy/smoke_test_endpoint.py \
              --endpoint-name "$ENDPOINT_NAME"
          else
            echo "No deploy/smoke_test_endpoint.py found, skipping smoke test."
          fi
