name: CD - Deploy to Azure ML

on:
  workflow_run:
    workflows: ["CI"]        # must match the name: CI
    types:
      - completed

jobs:
  deploy:
    name: Deploy after successful CI
    runs-on: ubuntu-latest

    # Only run if:
    # - CI concluded successfully
    # - The ref (branch/tag) name starts with "v" → version tag
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')

    env:
      # Azure authentication (service principal)
      # Secrets in the repository are stored without the AZURE_ prefix
      AZURE_TENANT_ID: ${{ secrets.TENANTID }}
      AZURE_CLIENT_ID: ${{ secrets.CLIENTID }}
      AZURE_CLIENT_SECRET: ${{ secrets.CLIENTSECRET }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTIONID }}

      # Azure ML workspace + project settings (consumed by pydantic Settings)
      SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTIONID }}
      RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
      WORKSPACE_NAME: ${{ secrets.WORKSPACE_NAME }}
      LOCATION: ${{ secrets.LOCATION }}
      AML_COMPUTE: ${{ secrets.AML_COMPUTE }}
      AML_DATASET: ${{ secrets.AML_DATASET }}
      INSTANCE_TYPE: ${{ secrets.INSTANCE_TYPE }}
      INSTANCE_COUNT: ${{ secrets.INSTANCE_COUNT }}

      # Endpoint / deployment config
      ENDPOINT_NAME: fraud-detection-prod
      DEPLOYMENT_NAME: blue
      MODEL_NAME: fraud-detection-prod

    steps:
      - name: Checkout repository at CI commit
        uses: actions/checkout@v4
        with:
          # Checkout the exact commit that CI ran on
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project (runtime deps or dev)
        run: |
          pip install -e ".[dev]"

      - name: Validate required deployment secrets
        run: |
          required_vars=(
            AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_SUBSCRIPTION_ID
            RESOURCE_GROUP WORKSPACE_NAME LOCATION AML_COMPUTE AML_DATASET
          )

          missing=()
          for var in "${required_vars[@]}"; do
            if [ -z "${!var}" ]; then
              missing+=("$var")
            fi
          done

          if [ ${#missing[@]} -ne 0 ]; then
            echo "Missing required secrets: ${missing[*]}" >&2
            exit 1
          fi

          echo "All required secrets are present."

      - name: Log in to Azure using service principal
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CLIENTID }}
          tenant-id: ${{ secrets.TENANTID }}
          subscription-id: ${{ secrets.SUBSCRIPTIONID }}

      - name: Install Azure ML CLI extension and configure defaults
        run: |
          az extension add -n ml -y
          az configure --defaults \
            group=$RESOURCE_GROUP \
            workspace=$WORKSPACE_NAME

      - name: Register local fraud dataset (idempotent)
        run: python scripts/register_data_asset.py register

      - name: Promote latest AutoML job to stable model name
        run: python deploy/promote_best_run.py --model-name "$MODEL_NAME"

      - name: Deploy latest model version to endpoint
        run: |
          python deploy/deploy_latest_model.py \
            --model-name "$MODEL_NAME" \
            --endpoint-name "$ENDPOINT_NAME" \
            --deployment-name "$DEPLOYMENT_NAME" \
            --instance-type "${INSTANCE_TYPE:-Standard_E4s_v3}" \
            --instance-count "${INSTANCE_COUNT:-1}"

      - name: Smoke test deployed endpoint
        run: python scripts/test_deployment.py

      - name: Delete endpoint after one hour to control costs
        run: |
          echo "Sleeping for one hour before deleting endpoint $ENDPOINT_NAME"
          sleep 3600
          python deploy/manage_online_endpoint.py delete "$ENDPOINT_NAME"
