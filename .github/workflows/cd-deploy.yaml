name: CD - Deploy to Azure ML

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
jobs:
  deploy:
    name: Deploy after successful CI
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read

    # Only run if:
    # - CI concluded successfully
    # - The ref is a version tag (refs/tags/v*)
    if: >
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_sha &&
        startsWith(github.event.workflow_run.head_branch, 'v')
      )

    env:
      PYTHONUNBUFFERED: "1"
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

    steps:
      - name: Checkout repository at CI commit
        uses: actions/checkout@v4
        with:
          # Checkout the exact commit that CI ran on
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # azure-ai-ml supports up to Python 3.11 today
          python-version: "3.11"

      - name: Upgrade pip and install build backend
        run: python -m pip install --upgrade pip build

      - name: Install project (runtime deps or dev)
        run: |
          python -m pip install -e ".[dev]"

      - name: Validate required deployment secrets
        run: |
          if [ -z "${AZURE_CREDENTIALS}" ]; then
            echo "Missing required secret: AZURE_CREDENTIALS"
            exit 1
          fi

      - name: Log in to Azure with a Service Principal Secret
        uses: azure/login@v2
        with:
          creds: ${{ env.AZURE_CREDENTIALS }}

      - name: Install Azure ML CLI extension and configure defaults
        run: |
          az extension add -n ml -y

      - name: Submit Azure ML training pipeline
        run: |
          python -m fraud_detection.training.pipeline submit

      - name: Smoke test online endpoint
        id: smoke_test
        continue-on-error: true
        run: |
          python -m fraud_detection.cli serve-invoke

      - name: Roll back traffic if smoke test fails
        if: steps.smoke_test.outcome == 'failure'
        run: |
          python - <<'PY'
          from fraud_detection.azure.client import get_ml_client
          from fraud_detection.config import get_settings
          from fraud_detection.serving.online_endpoint import update_traffic

          settings = get_settings()
          ml_client = get_ml_client(settings=settings)
          endpoint = ml_client.online_endpoints.get(settings.endpoint_name)
          traffic = dict(endpoint.traffic or {})
          failed_deployment = settings.deployment_name
          rollback_candidates = {
              name: pct for name, pct in traffic.items() if name != failed_deployment
          }
          if not rollback_candidates:
              raise SystemExit("No rollback candidate found in endpoint traffic map.")

          stable_deployment = max(rollback_candidates, key=rollback_candidates.get)
          update_traffic(
              ml_client,
              endpoint_name=settings.endpoint_name,
              traffic={stable_deployment: 100},
          )
          raise SystemExit(
              f"Smoke test failed; rolled back traffic to '{stable_deployment}'."
          )
          PY
