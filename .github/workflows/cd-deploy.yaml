name: CD - Deploy to Azure ML

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
jobs:
  deploy:
    name: Deploy after successful CI
    runs-on: ubuntu-latest

    permissions:
      contents: read

    # Only run if:
    # - CI concluded successfully
    # - The ref (branch/tag) name starts with "v" → version tag
    if: >
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        startsWith(github.event.workflow_run.head_branch, 'v')
      ) || github.event_name == 'workflow_dispatch'

    env:
      PYTHONUNBUFFERED: "1"
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

    steps:
      - name: Checkout repository at CI commit
        uses: actions/checkout@v4
        with:
          # Checkout the exact commit that CI ran on
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # azure-ai-ml supports up to Python 3.11 today
          python-version: "3.11"

      - name: Upgrade pip and install build backend
        run: python -m pip install --upgrade pip build

      - name: Install project (runtime deps or dev)
        run: |
          python -m pip install -e ".[dev]"

      - name: Validate required deployment secrets
        run: |
          if [ -z "${AZURE_CREDENTIALS}" ]; then
            echo "Missing required secret: AZURE_CREDENTIALS"
            exit 1
          fi

      - name: Log in to Azure with a Service Principal Secret
        uses: azure/login@v2
        with:
          creds: "$AZURE_CREDENTIALS"

      - name: Install Azure ML CLI extension and configure defaults
        run: |
          az extension add -n ml -y

      - name: Validate data
        run: |
          fraud-cli validate-data

      - name: Register best model for production
        run: |
          fraud-cli register-best-automl-model

      - name: Ensure online endpoint exists
        run: |
          fraud-cli endpoint-create

      - name: Deploy latest model version to endpoint
        run: |
          fraud-cli deploy

      - name: Smoke test deployed endpoint
        run: |
          fraud-cli serve-invoke 