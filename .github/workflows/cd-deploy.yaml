name: CD - Deploy to Azure ML

on:
  workflow_run:
    workflows: ["CI"]        # must match the name: CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (version tag) to deploy"
        required: true

jobs:
  deploy:
    name: Deploy after successful CI
    runs-on: ubuntu-latest

    # Only run if:
    # - CI concluded successfully
    # - The ref (branch/tag) name starts with "v" → version tag
    if: |
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v')) ||
      (github.event_name == 'workflow_dispatch' &&
       startsWith(github.event.inputs.ref, 'v'))

    env:
      # Azure authentication (service principal)
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Azure ML workspace + project settings (consumed by pydantic Settings)
      SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      RESOURCE_GROUP: ${{ secrets.AZURE_ML_RESOURCE_GROUP }}
      WORKSPACE_NAME: ${{ secrets.AZURE_ML_WORKSPACE }}
      LOCATION: ${{ secrets.AZURE_ML_LOCATION }}
      AML_COMPUTE: ${{ secrets.AZURE_ML_COMPUTE }}
      AML_DATASET: ${{ secrets.AZURE_ML_DATASET }}
      INSTANCE_TYPE: ${{ secrets.AZURE_ML_INSTANCE_TYPE }}
      INSTANCE_COUNT: ${{ secrets.AZURE_ML_INSTANCE_COUNT }}

      # Endpoint / deployment config
      ENDPOINT_NAME: fraud-detection-prod
      DEPLOYMENT_NAME: blue
      MODEL_NAME: fraud-detection-prod

    steps:
      - name: Checkout repository at target ref
        uses: actions/checkout@v4
        with:
          # Checkout CI commit or manually provided ref
          # For workflow_run, always use the exact commit SHA that passed CI.
          # For manual dispatch, explicitly target the provided version tag.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || format('refs/tags/{0}', github.event.inputs.ref) }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project (runtime deps or dev)
        run: |
          pip install -e ".[dev]"

      - name: Log in to Azure using service principal
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure ML CLI extension and configure defaults
        run: |
          az extension add -n ml -y
          az configure --defaults \
            group=$RESOURCE_GROUP \
            workspace=$WORKSPACE_NAME

      - name: Register local fraud dataset (idempotent)
        run: python scripts/register_data_asset.py register

      - name: Promote latest AutoML job to stable model name
        run: python deploy/promote_best_run.py --model-name "$MODEL_NAME"

      - name: Deploy latest model version to endpoint
        run: |
          python deploy/deploy_latest_model.py \
            --model-name "$MODEL_NAME" \
            --endpoint-name "$ENDPOINT_NAME" \
            --deployment-name "$DEPLOYMENT_NAME" \
            --instance-type "${INSTANCE_TYPE:-Standard_E4s_v3}" \
            --instance-count "${INSTANCE_COUNT:-1}"

      - name: Smoke test deployed endpoint
        run: python scripts/test_deployment.py

      - name: Delete endpoint after one hour to control costs
        run: |
          echo "Sleeping for one hour before deleting endpoint $ENDPOINT_NAME"
          sleep 3600
          python deploy/manage_online_endpoint.py delete "$ENDPOINT_NAME"
