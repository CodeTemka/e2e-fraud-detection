[project]
name = "e2e-fraud-detection"
version = "0.1.0"
description = "End-to-end fraud detection workflows powered by Azure ML"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Fraud Detection Team" }]

dependencies = [
  "azure-ai-ml>=1.20.0",
  "azure-identity>=1.17.0",
  "kaggle>=1.6.17",
  "mlflow>=2.15.0",
  "pandas>=2.2.0",
  "pynacl>=1.5.0",
  "requests>=2.32.0",
  "scikit-learn>=1.4.0",
  "lightgbm>=4.5.0",
  "python-dotenv>=1.0.1",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.6.0",
  "typer>=0.12.5",
]

[project.optional-dependencies]
dev = [
  "black>=24.10.0",
  "isort>=5.13.0",
  "ruff>=0.7.0",
  "pytest>=8.3.0",
  "pytest-mock>=3.14.0",
]

[project.scripts]
fraud-cli = "fraud_detection.cli:run"

# ✅ IMPORTANT for src/ layout:
# Tell setuptools that packages live under ./src
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["fraud_detection*"]

# If you have non-.py files inside the package you want included at install time,
# uncomment the next line and add a MANIFEST.in or use tool.setuptools.package-data.
# include-package-data = true


[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"


[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["data", "deploy", "train", "notebooks", "azure_connection"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
