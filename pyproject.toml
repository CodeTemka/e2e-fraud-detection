[project]
name = "e2e-fraud-detection"
version = "0.1.0"
description = "End-to-end fraud detection on Azure ML"
requires-python = ">=3.9"

[tool.ruff]
line-length = 100
src = ["src", "train", "deploy", "azure_connection"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["fraud_detection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
